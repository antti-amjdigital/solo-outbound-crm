name: Nightly database backup

# Dumps Neon Postgres nightly. Neon's free PITR window is only ~24h —
# this is the real backup. Requires repo secrets (see README).

on:
  schedule:
    # 02:00 UTC ≈ 05:00 Europe/Helsinki (winter) / 04:00 (summer)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          # Prefer the direct (non-pooled) URL — pg_dump against a pooler is flaky
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing secret BACKUP_DATABASE_URL (use Neon's direct connection string)."
            exit 1
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="crm-${STAMP}.dump"
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="$OUT"
          ls -lh "$OUT"
          echo "DUMP_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_FILE }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 90
          if-no-files-found: error

      # Optional: mirror into a private backup repo
      # (set BACKUP_REPO = owner/name and BACKUP_GITHUB_TOKEN with contents:write).
      - name: Push to backup repository
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_REPO:-}" ] || [ -z "${BACKUP_GITHUB_TOKEN:-}" ]; then
            echo "Optional mirror skipped (BACKUP_REPO / BACKUP_GITHUB_TOKEN not set)."
            exit 0
          fi
          git config --global user.email "backup@users.noreply.github.com"
          git config --global user.name "CRM backup bot"
          git clone --depth 1 "https://x-access-token:${BACKUP_GITHUB_TOKEN}@github.com/${BACKUP_REPO}.git" backup-repo
          mkdir -p backup-repo/dumps
          cp "$DUMP_FILE" "backup-repo/dumps/"
          cd backup-repo
          git add "dumps/$DUMP_FILE"
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "backup: $DUMP_FILE"
          git push
